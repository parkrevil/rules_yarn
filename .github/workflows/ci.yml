name: CI

on:
  push:
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # The gate AGENTS.md asks for before every commit, on every build root.
  # `.bazelignore` keeps the others out of the root run, so each needs its own.
  build-and-test:
    name: build and test (${{ matrix.os }})
    strategy:
      # One platform failing should not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both runner images ship Bazelisk as `bazel`, so .bazelversion decides
      # the version and no setup action is needed.
      - name: Report the Bazel version in use
        run: bazel --version

      # The first run on this workflow used processwrapper-sandbox on Linux, so
      # the block-network tag was not honoured and yarn_offline_test could not
      # show what it exists to show. Nothing in the log said why. This reports
      # the state before and after a plausible cause is addressed, so the next
      # change acts on a measurement instead of a guess. A sysctl set here
      # stays set for the build and test steps below, on the same runner, so
      # if the cause is the one addressed those steps benefit too — that is
      # intended, not incidental.
      - name: Report what sandbox the runner allows
        if: runner.os == 'Linux'
        run: |
          for s in kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns; do
            printf 'before: %s = %s\n' "$s" "$(sysctl -n "$s" 2>&1)"
          done
          unshare -Ur true && echo "before: unshare -Ur ok" || echo "before: unshare -Ur refused"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1 || true
          unshare -Ur true && echo "after: unshare -Ur ok" || echo "after: unshare -Ur refused"
          echo "--- what Bazel reports when linux-sandbox is demanded ---"
          bazel test --spawn_strategy=linux-sandbox --nocache_test_results \
            //tests/launcher:yarn_offline_test 2>&1 | tail -25 || true

      - name: Build and test the ruleset
        run: bazel build //... && bazel test //... --test_output=errors

      - name: Build and test the consumer module
        working-directory: e2e/smoke
        run: bazel build //... && bazel test //... --test_output=errors

      - name: Build and test the yarn.install consumer module
        working-directory: e2e/install
        run: bazel build //... && bazel test //... --test_output=errors

      # What only a fresh consumer can show about yarn.install: fetching,
      # pinning, refetching and isolation from the host, against a local
      # registry so no public one is needed.
      - name: Run the yarn.install scenarios
        run: tools/ci/install_scenarios.sh

      # The module the registry presubmit runs. Its own .bazelrc keeps it
      # from writing a lockfile, as the other two roots' .bazelrc files pin
      # theirs.
      - name: Build and test the registry test module
        working-directory: tests/bcr
        run: bazel build //... && bazel test //... --test_output=errors

  # A consumer resolving from scratch under the oldest Bazel MODULE.bazel
  # accepts. The repository's own roots cannot check this: their lockfiles are
  # written by a newer Bazel and both set --lockfile_mode=error.
  minimum-bazel:
    name: oldest supported Bazel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run a Yarn target at the declared floor
        run: tools/ci/minimum_bazel.sh

      # The same floor for yarn.install. The module's lock is written by the
      # Bazel in .bazelversion, which an older Bazel refuses, so this run
      # resolves without it, as a consumer starting from scratch would. The
      # offline test needs the sandbox adjustment the build-and-test job makes,
      # and is run there.
      - name: Install a project with yarn.install at the declared floor
        working-directory: e2e/install
        run: |
          floor=$(sed -n 's/.*bazel_compatibility.*">=\([0-9][0-9.]*\)".*/\1/p' ../../MODULE.bazel)
          USE_BAZEL_VERSION="$floor" bazel test --lockfile_mode=off --test_output=errors -- //... -//:offline_test

  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # pre-commit's openspec hook runs the CLI from PATH.
      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.13.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      # Covers buildifier, its linter, the file hygiene hooks, and
      # `openspec validate --all --strict`.
      - name: Run the pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

      # Both hooks are harness tooling with no Bazel target, so their contract
      # tables are run here.
      - name: Check the generated-file guard's contract
        run: tools/hooks/protect_generated_test.sh

      - name: Check the wiki staleness gate's contract
        run: tools/hooks/openwiki_staleness_test.sh

      # The wiki is generated, so it goes stale rather than wrong. Checking it
      # needs no model, only the sources its own claims name.
      - name: Check the wiki still describes the repository
        run: tools/hooks/openwiki_staleness.sh

      # What a release builds, under a tag of this run's own: the source
      # archive, and beside it the archive of the public API's documentation
      # holding each public .bzl file's, at the name .bcr/source.template.json
      # links as docs_url; the release notes, release_prep.sh's standard
      # output, hold nothing else.
      - name: Build the release archives
        run: |
          tag=v0.0.0-ci
          git tag "$tag"
          GITHUB_REF_NAME="$tag" .github/workflows/release_prep.sh >"$RUNNER_TEMP/notes.md"
          test "$(head -1 "$RUNNER_TEMP/notes.md")" = "## Using this release"
          test -s "rules_yarn-$tag.tar.gz"
          docs="$(node -p 'JSON.parse(require("fs").readFileSync(".bcr/source.template.json", "utf8")).docs_url' | sed "s|.*/||; s|{REPO}|rules_yarn|g; s|{TAG}|$tag|g")"
          test "$docs" = "rules_yarn-$tag.docs.tar.gz"
          test "$(tar -tzf "$docs" | grep '\.binaryproto$' | LC_ALL=C sort | paste -sd' ' -)" = \
            "./yarn/defs.doc_extract.binaryproto ./yarn/extensions.doc_extract.binaryproto ./yarn/providers.doc_extract.binaryproto"
