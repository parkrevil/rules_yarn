schema: spec-driven

context: |
  Bazel ruleset delivering the Yarn CLI. Bzlmod only, no WORKSPACE.
  Engineering constraints, layout, and pin locations are stated in AGENTS.md;
  do not restate them here.

rules:
  specs:
    - State observable behavior only; keep implementation detail in design.md.
  tasks:
    - Every task names how it is verified.

operations:
  apply:
    guidance:
      - Follow the invariants and working rules in AGENTS.md; they are authoritative.
      - Never use rules_nodejs target_tool_path or tool_files.
